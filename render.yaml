databases:
  - name: yiqifei-db
    plan: free
    databaseName: travel_baggage
    user: travel_baggage

services:
  - type: web
    name: yiqifei-baggage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn contral.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      # 由 Render 自动注入数据库连接串，后续无需手工修改
      - key: DATABASE_URL
        fromDatabase:
          name: yiqifei-db
          property: connectionString
